name: Generate 3D profile

on:
  schedule:            # every day at 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:   # manual run button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3D isometric contribution city  ->  profile-3d-contrib/*.svg
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Anu7276

      # re-render the hand-built 3D banners (cheap, deterministic)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && python scripts/build_3d.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh 3D profile"
          git push
