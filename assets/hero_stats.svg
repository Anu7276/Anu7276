<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="124" viewBox="0 0 1000 124"><defs><linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#160d0a"/><stop offset="1" stop-color="#1f120d"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a3320"/><stop offset="0.5" stop-color="#ffb347"/><stop offset="1" stop-color="#7a3320"/></linearGradient><style>
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tail{animation:wag 1.8s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
.wave{animation:wave .9s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.twinkle{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.rise{animation:rise 4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-120px);opacity:0}}
.smoke{animation:smoke 6s ease-out infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:.5}100%{transform:translate(20px,-90px) scale(1.8);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.drift{animation:drift 30s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(1120px)}}
.dash{stroke-dasharray:8 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-16}}
.glow{animation:glow 2.5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.95}}
.hop{animation:hop 1.4s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 2s ease-out both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.par1{animation:par1 70s linear infinite}@keyframes par1{to{transform:translateX(-1000px)}}
.par2{animation:par2 40s linear infinite}@keyframes par2{to{transform:translateX(-1000px)}}
.fl{animation:fl 3.4s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.shine{animation:shine 5s ease-in-out infinite}@keyframes shine{0%{transform:translateX(-260px)}55%,100%{transform:translateX(460px)}}
.rim{animation:rim 2.6s ease-in-out infinite}@keyframes rim{0%,100%{opacity:.35}50%{opacity:1}}
.rise3{animation:rise3 3.2s ease-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes rise3{0%{transform:scaleY(0)}60%{transform:scaleY(1)}100%{transform:scaleY(1)}}
</style></defs><rect x="1" y="1" width="998" height="122" rx="22" fill="url(#cardbg)" stroke="url(#edge)" stroke-width="2"/><rect x="30" y="32" width="164" height="60" rx="14" fill="#0f0705" stroke="#0a0504" stroke-width="1.5"/><rect x="30" y="24" width="164" height="60" rx="14" fill="#2c1710" stroke="#ffd54a" stroke-width="1.5"/><rect x="35" y="27" width="154" height="2.5" rx="1.2" fill="#fff" opacity=".13"/><text x="112" y="54" font-family="'Trebuchet MS','Comic Sans MS','Segoe UI',Verdana,sans-serif" font-size="24" fill="#ffd54a" font-weight="900" text-anchor="middle" >#119</text><text x="112" y="72" font-family="'Courier New',Consolas,Menlo,monospace" font-size="9" fill="#c9aa9c" font-weight="bold" text-anchor="middle" >HACKERRANK / 1,773</text><rect x="206" y="32" width="164" height="60" rx="14" fill="#0f0705" stroke="#0a0504" stroke-width="1.5"/><rect x="206" y="24" width="164" height="60" rx="14" fill="#2c1710" stroke="#ffb347" stroke-width="1.5"/><rect x="211" y="27" width="154" height="2.5" rx="1.2" fill="#fff" opacity=".13"/><text x="288" y="54" font-family="'Trebuchet MS','Comic Sans MS','Segoe UI',Verdana,sans-serif" font-size="24" fill="#ffb347" font-weight="900" text-anchor="middle" >GOLD</text><text x="288" y="72" font-family="'Courier New',Consolas,Menlo,monospace" font-size="9" fill="#c9aa9c" font-weight="bold" text-anchor="middle" >CODECHEF BADGE</text><rect x="382" y="32" width="164" height="60" rx="14" fill="#0f0705" stroke="#0a0504" stroke-width="1.5"/><rect x="382" y="24" width="164" height="60" rx="14" fill="#2c1710" stroke="#ff6a3d" stroke-width="1.5"/><rect x="387" y="27" width="154" height="2.5" rx="1.2" fill="#fff" opacity=".13"/><text x="464" y="54" font-family="'Trebuchet MS','Comic Sans MS','Segoe UI',Verdana,sans-serif" font-size="24" fill="#ff6a3d" font-weight="900" text-anchor="middle" >100%</text><text x="464" y="72" font-family="'Courier New',Consolas,Menlo,monospace" font-size="9" fill="#c9aa9c" font-weight="bold" text-anchor="mid