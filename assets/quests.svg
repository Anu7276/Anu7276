<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="356" viewBox="0 0 1000 356">
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120a08"/>
      <stop offset="0.55" stop-color="#1e0f0b"/>
      <stop offset="1" stop-color="#2c150e"/>
    </linearGradient>
    <linearGradient id="bossGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a160e"/>
      <stop offset="0.55" stop-color="#26120d"/>
      <stop offset="1" stop-color="#1c0d09"/>
    </linearGradient>
    <linearGradient id="emberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30"/>
      <stop offset="0.5" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(255,179,71,0)"/>
      <stop offset="0.5" stop-color="rgba(255,179,71,0.12)"/>
      <stop offset="1" stop-color="rgba(255,179,71,0)"/>
    </linearGradient>
    <style>
      .pulse{animation:pulse 1.8s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
      .bob{animation:bob 2.8s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      .rise{animation:rise 4.5s ease-in infinite}
      @keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.85}100%{transform:translateY(-90px);opacity:0}}
      .sweep{animation:sweep 5.5s ease-in-out infinite}
      @keyframes sweep{0%{transform:translateX(-280px)}55%,100%{transform:translateX(1020px)}}
      .bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.8s ease-out both}
      @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    </style>
  </defs>

  <!-- Outer Quest Board -->
  <rect x="4" y="4" width="992" height="348" rx="16" fill="url(#qbg)" stroke="#7a3320" stroke-width="2"/>
  <rect x="12" y="12" width="976" height="332" rx="12" fill="none" stroke="#3a1a10" stroke-width="1"/>

  <!-- Subtle Ember Particles -->
  <circle cx="88" cy="325" r="2.2" fill="#ff6a3d" class="rise"/>
  <circle cx="290" cy="332" r="1.8" fill="#ffb347" class="rise" style="animation-delay:1.1s"/>
  <circle cx="640" cy="330" r="2" fill="#ff3b30" class="rise" style="animation-delay:2.2s"/>
  <circle cx="910" cy="322" r="2.4" fill="#ffb347" class="rise" style="animation-delay:.6s"/>

  <!-- Header Strip -->
  <circle cx="30" cy="33" r="5" fill="#ff3b30" class="pulse"/>
  <text x="44" y="37" font-family="'Courier New',Consolas,Menlo,monospace" font-size="12" font-weight="bold" fill="#ffb347" letter-spacing="2">QUEST BOARD // FEATURED DEPLOYMENTS</text>
  <text x="970" y="37" font-family="'Courier New',Consolas,Menlo,monospace" font-size="11" fill="#c9aa9c" text-anchor="end">10 MAIN · 11 SIDE QUESTS</text>
  <line x1="24" y1="50" x2="976" y2="50" stroke="#4a2015" stroke-width="1"/>

  <!-- BOSS QUEST BANNER -->
  <g>
    <rect x="24" y="64" width="952" height="106" rx="12" fill="url(#bossGrad)" stroke="#ff6a3d" stroke-width="1.8"/>
    <clipPath id="bossClip"><rect x="24" y="64" width="952" height="106" rx="12"/></clipPath>
    <rect x="24" y="64" width="220" height="106" fill="url(#shimmer)" clip-path="url(#bossClip)" class="sweep"/>

    <rect x="40" y="78" width="114" height="22" rx="6" fill="#ff3b30"/>
    <text x="97" y="93" font-family="'Courier New',Consolas,Menlo,monospace" font-size="11" font-weight="bold" fill="#fff1e0" text-anchor="middle" letter-spacing="1">BOSS QUEST</text>

    <rect x="162" y="78" width="84" height="22" rx="6" fill="#251410" stroke="#ffb347" stroke-width="1"/>
    <text x="204" y="93" font-family="'Courier New',Consolas,Menlo,monospace" font-size="11" font-weight="bold" fill="#ffb347" text-anchor="middle">SIH 1345</text>

    <text x="40" y="126" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="22" font-weight="bold" fill="#fff1e0">Startup-AYUSH Portal</text>
    <text x="40" y="150" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="13" fill="#c9aa9c">Multimodal pitch-deck intake + 20-min adaptive AI voice interview + FAISS RAG scoring (/30)</text>

    <!-- Right XP / Score Meter -->
    <text x="954" y="93" font-family="'Courier New',Consolas,Menlo,monospace" font-size="11" fill="#ffb347" text-anchor="end">MINISTRY OF AYUSH · LIVE DEMO</text>
    <rect x="774" y="114" width="180" height="10" rx="5" fill="#120a08" stroke="#7a3320" stroke-width="1"/>
    <rect x="774" y="114" width="166" height="10" rx="5" fill="url(#emberLine)" class="bar"/>
    <text x="954" y="146" font-family="'Courier New',Consolas,Menlo,monospace" font-size="11" fill="#fff1e0" text-anchor="end">Gemini · Groq · FAISS · Voice</text>
  </g>

  <!-- 4 FEATURED QUEST CARDS -->
  <!-- Card 1: Insurance Claim Pipeline -->
  <g class="bob">
    <rect x="24" y="186" width="226" height="142" rx="10" fill="#20110c" stroke="#ffb347" stroke-width="1.4"/>
    <rect x="38" y="200" width="70" height="18" rx="4" fill="#3a220d" stroke="#ffb347" stroke-width="1"/>
    <text x="73" y="213" font-family="'Courier New',Consolas,Menlo,monospace" font-size="10" font-weight="bold" fill="#ffb347" text-anchor="middle">MYTHIC</text>
    <text x="236" y="213" font-family="'Courier New',Consolas,Menlo,monospace" font-size="11" font-weight="bold" fill="#ff6a3d" text-anchor="end">#119 / 1,773</text>
    <text x="38" y="244" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="bold" fill="#fff1e0">Claim Verifier AI</text>
    <text x="38" y="266" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="12" fill="#c9aa9c">100% accuracy multimodal</text>
    <text x="38" y="283" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="12" fill="#c9aa9c">insurance claim pipeline.</text>
    <text x="38" y="312" font-family="'Courier New',Consolas,Menlo,monospace" font-size="10" fill="#ffb347">Groq · Gemini 2.5 · Cache</text>
  </g>

  <!-- Card 2: Maya -->
  <g class="bob" style="animation-delay:.4s">
    <rect x="266" y="186" width="226" height="142" rx="10" fill="#20110c" stroke="#ff6a3d" stroke-width="1.4"/>
    <rect x="280" y="200" width="82" height="18" rx="4" fill="#3a160e" stroke="#ff6a3d" stroke-width="1"/>
    <text x="321" y="213" font-family="'Courier New',Consolas,Menlo,monospace" font-size="10" font-weight="bold" fill="#ff6a3d" text-anchor="middle">LEGENDARY</text>
    <text x="478" y="213" font-family="'Courier New',Consolas,Menlo,monospace" font-size="11" font-weight="bold" fill="#ffb347" text-anchor="end">DESKTOP</text>
    <text x="280" y="244" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="bold" fill="#fff1e0">Maya AI Agent</text>
    <text x="280" y="266" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="12" fill="#c9aa9c">Voice + memory + real</text>
    <text x="280" y="283" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="12" fill="#c9aa9c">Windows tool execution.</text>
    <text x="280" y="312" font-family="'Courier New',Consolas,Menlo,monospace" font-size="10" fill="#ffb347">Llama 3.3 · Chroma · STT/TTS</text>
  </g>

  <!-- Card 3: VIVORA -->
  <g class="bob" style="animation-delay:.8s">
    <rect x="508" y="186" width="226" height="142" rx="10" fill="#20110c" stroke="#7a3320" stroke-width="1.4"/>
    <rect x="522" y="200" width="54" height="18" rx="4" fill="#2e1510" stroke="#ff8f7a" stroke-width="1"/>
    <text x="549" y="213" font-family="'Courier New',Consolas,Menlo,monospace" font-size="10" font-weight="bold" fill="#ff8f7a" text-anchor="middle">EPIC</text>
    <text x="720" y="213" font-family="'Courier New',Consolas,Menlo,monospace" font-size="11" font-weight="bold" fill="#ffb347" text-anchor="end">30M SESSIONS</text>
    <text x="522" y="244" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="bold" fill="#fff1e0">VIVORA</text>
    <text x="522" y="266" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="12" fill="#c9aa9c">Multi-agent viva &amp; interview</text>
    <text x="522" y="283" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="12" fill="#c9aa9c">examiner for students.</text>
    <text x="522" y="312" font-family="'Courier New',Consolas,Menlo,monospace" font-size="10" fill="#ffb347">Multi-Agent · LLMs · React</text>
  </g>

  <!-- Card 4: CAMPAIGNIX -->
  <g class="bob" style="animation-delay:1.2s">
    <rect x="750" y="186" width="226" height="142" rx="10" fill="#20110c" stroke="#7a3320" stroke-width="1.4"/>
    <rect x="764" y="200" width="54" height="18" rx="4" fill="#2e1510" stroke="#ff8f7a" stroke-width="1"/>
    <text x="791" y="213" font-family="'Courier New',Consolas,Menlo,monospace" font-size="10" font-weight="bold" fill="#ff8f7a" text-anchor="middle">EPIC</text>
    <text x="962" y="213" font-family="'Courier New',Consolas,Menlo,monospace" font-size="11" font-weight="bold" fill="#ffb347" text-anchor="end">AUTO PDF</text>
    <text x="764" y="244" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="bold" fill="#fff1e0">CAMPAIGNIX</text>
    <text x="764" y="266" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="12" fill="#c9aa9c">21-day strategy, copy &amp; gap</text>
    <text x="764" y="283" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="12" fill="#c9aa9c">analysis for D2C brands.</text>
    <text x="764" y="312" font-family="'Courier New',Consolas,Menlo,monospace" font-size="10" fill="#ffb347">Python · Firecrawl · Agents</text>
  </g>
</svg>
