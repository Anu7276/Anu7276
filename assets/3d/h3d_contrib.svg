<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="110" viewBox="0 0 1000 110"><defs><style>
.bob{animation:bob 3s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bob2{animation:bob 3.6s ease-in-out infinite .6s}.bob3{animation:bob 2.7s ease-in-out infinite 1.1s}
.rise{animation:rise 5s ease-in infinite}@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.95}100%{transform:translateY(-190px);opacity:0}}
.ring{stroke-dasharray:14 10;animation:ring 3s linear infinite}@keyframes ring{to{stroke-dashoffset:-96}}
.glow{animation:glow 2.6s ease-in-out infinite}@keyframes glow{0%,100%{opacity:.45}50%{opacity:.95}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.press{animation:press 2.4s ease-in-out infinite}@keyframes press{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.float{animation:float 3.4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.zap{animation:zap 1.7s steps(1) infinite}@keyframes zap{0%,100%{opacity:0}6%,12%{opacity:1}18%{opacity:0}55%{opacity:0}58%,63%{opacity:.9}66%{opacity:0}}
.shine{animation:shine 4.2s ease-in-out infinite}@keyframes shine{0%{transform:translateX(0)}60%,100%{transform:translateX(760px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.sweep{animation:sweep 5s ease-in-out infinite}@keyframes sweep{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
</style><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120a08"/><stop offset="1" stop-color="#3a1a10"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a3d"/><stop offset="1" stop-color="#7a3320"/></linearGradient><radialGradient id="halo"><stop offset="0" stop-color="#ff6a3d" stop-opacity=".75"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="7"/></filter></defs><rect width="1000" height="110" rx="22" fill="url(#bg)" stroke="url(#edge)" stroke-width="2.5"/><rect x="2" y="2" width="996" height="106" rx="22" fill="url(#bg)"/><g class="" ><polygon points="44,36 70,49.0 70,75.0 44,62" fill="#ff6a3d"/><polygon points="70,49.0 96,36 96,62 70,75.0" fill="#9e4125"/><polygon points="70,23.0 96,36 70,49.0 44,36" fill="#ff9e80"/><polyline points="44,36 70,49.0 96,36" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.2"/></g><g class="glow"><polygon points="70,23 96,36 70,49 44,36" fill="#ffd54a" opacity=".35"/></g><text x="122" y="38" font-family="'Courier New',Consolas,Menlo,monospace" font-size="13" font-weight="bold" fill="#ffb347" text-anchor="start" >BONUS STAGE</text><text x="126.0" y="92.0" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="44" font-weight="900" fill="#58190d" text-anchor="start" >3D Contribution City</text><text x="125.0" y="91.0" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="44" font-weight="900" fill="#6a1e10" text-anchor="start" >3D Contribution City</text><text x="124.0" y="90.0" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="44" font-weight="900" fill="#7c2313" text-anchor="start" >3D Contribution City</text><text x="123.0" y="89.0" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="44" font-weight="900" fill="#8e2816" text-anchor="start" >3D Contribution City</text><text x="122.0" y="88.0" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="44" font-weight="900" fill="#a02d19" text-anchor="start" >3D Contribution City</text><text x="121.0" y="87.0" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="44" font-weight="900" fill="#b2321c" text-anchor="start" >3D Contribution City</text><text x="120" y="86" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="44" font-weight="900" fill="#fff1e0" text-anchor="start" stroke="#fff" stroke-opacity=".25" stroke-width="1">3D Contribution City</text><rect x="760" y="60" width="200" height="6" rx="3" fill="#ff6a3d" opacity=".6" class="sweep"/></svg>