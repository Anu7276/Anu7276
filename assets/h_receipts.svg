<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="92" viewBox="0 0 1000 92"><defs><linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6a3d"/><stop offset="0.55" stop-color="#ffb347"/><stop offset="1" stop-color="rgba(0,0,0,0)"/></linearGradient><style>
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tail{animation:wag 1.8s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
.wave{animation:wave .9s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.twinkle{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.rise{animation:rise 4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-120px);opacity:0}}
.smoke{animation:smoke 6s ease-out infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:.5}100%{transform:translate(20px,-90px) scale(1.8);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.drift{animation:drift 30s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(1120px)}}
.dash{stroke-dasharray:8 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-16}}
.glow{animation:glow 2.5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.95}}
.hop{animation:hop 1.4s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 2s ease-out both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.par1{animation:par1 70s linear infinite}@keyframes par1{to{transform:translateX(-1000px)}}
.par2{animation:par2 40s linear infinite}@keyframes par2{to{transform:translateX(-1000px)}}
.fl{animation:fl 3.4s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.shine{animation:shine 5s ease-in-out infinite}@keyframes shine{0%{transform:translateX(-260px)}55%,100%{transform:translateX(460px)}}
.rim{animation:rim 2.6s ease-in-out infinite}@keyframes rim{0%,100%{opacity:.35}50%{opacity:1}}
.rise3{animation:rise3 3.2s ease-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes rise3{0%{transform:scaleY(0)}60%{transform:scaleY(1)}100%{transform:scaleY(1)}}
</style></defs><ellipse cx="52" cy="76" rx="30" ry="7" fill="#000" opacity=".45"/><g class="fl"><polygon points="28,40 52,53 52,79 28,66" fill="#9e4125" stroke="#0a0504" stroke-width="1.5" stroke-linejoin="round"/><polygon points="52,53 76,40 76,66 52,79" fill="#6b2c19" stroke="#0a0504" stroke-width="1.5" stroke-linejoin="round"/><polygon points="52,27 76,40 52,53 28,40" fill="#ff6a3d" stroke="#0a0504" stroke-width="1.5" stroke-linejoin="round"/></g><g class="fl" style="animation-delay:.9s"><polygon points="75,58 86,64 86,76 75,70" fill="#9e6e2c" stroke="#0a0504" stroke-width="1.5" stroke-linejoin="round"/><polygon points="86,64 97,58 97,70 86,76" fill="#6b4b1d" stroke="#0a0504" stroke-width="1.5" stroke-linejoin="round"/><polygon points="86,52 97,58 86,64 75,58" fill="#ffb347" stroke="#0a0504" stroke-width="1.5" stroke-linejoin="round"/></g><text x="116" y="30" font-family="'Courier New',Consolas,Menlo,monospace" font-size="11" fill="#ffb347" font-weight="bold" text-anchor="start" letter-spacing="3">CHAPTER 02</text><text x="119.6" y="76.0" font-family="'Trebuchet MS','Comic Sans MS','Segoe UI',Verdana,sans-serif" font-size="34" font-weight="900" fill="#3a1209" stroke="#3a1209" stroke-width="1" text-anchor="start" >Receipts, Not Claims</text><text x="119.0" y="75.0" font-family="'Trebuchet MS','Comic Sans MS','Segoe UI',Verdana,sans-serif" font-size="34" font-weight="900" fill="#501b0c" stroke="#501b0c" stroke-width="1" text-anchor="start" >Receipts, Not Claims</text><text x="118.4" y="74.0" font-family="'Trebuchet MS','Comic Sans MS','Segoe UI',Verdana,sans-serif" font-size="34" font-weight="900" fill="#672410" stroke="#672410" stroke-width="1" text-anchor="start" >Receipts, Not Claims</text><text x="117.8" y="73.0" font-family="'Trebuchet MS','Comic Sans MS','Segoe UI',Verdana,sans-serif" font-size="34" font-weight="900" fill="#7e2d14" stroke="#7e2d14" stroke-width="1" text-anchor="start" >Receipts, Not Claims</text><text x="117.2" y="72.0" font-family="'Trebuchet MS','Comic Sans MS','Segoe UI',Verdana,sans-serif" font-size="34" font-weight="900" fill="#943617" stroke="#943617" stroke-width="1" text-anchor="start" >Receipts, Not Claims</text><text x="116.6" y="71.0" font-family="'Trebuchet MS','Comic Sans MS','Segoe UI',Verdana,sans-serif" font-size="34" font-weight="900" fill="#ab3f1b" stroke="#ab3f1b" stroke-width="1" text-anchor="start" >Receipts, Not Claims</text><text x="116" y="70" font-family="'Trebuchet MS','Comic Sans MS','Segoe UI',Verdana,sans-serif" font-size="34" font-weight="900" fill="#fff1e0" stroke="#0a0504" stroke-width="5" paint-order="stroke" stroke-linejoin="round" text-anchor="start" >Receipts, Not Claims</text><line x1="116" y1="84" x2="965" y2="84" stroke="url(#hl)" stroke-width="3" stroke-linecap="round" class="dash"/></svg>